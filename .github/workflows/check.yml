name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y clang llvm
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bun run format:check
      - run: bun run check
      - run: mkdir /tmp/boxes-package-check
      - run: bun pm pack --ignore-scripts --destination /tmp/boxes-package-check
      - run: bun run pack:runtime /tmp/boxes-package-check
      - run: bun run package:proof /tmp/boxes-package-check/minutei-ai-boxes-[0-9]*.tgz /tmp/boxes-package-check/minutei-ai-boxes-runtime-[0-9]*.tgz
