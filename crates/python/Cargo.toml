[package]
name = "cirro-python"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
base64 = "=0.23.1"
rustpython-vm = { version = "=0.6.0", default-features = false, features = [
  "compiler",
  "freeze-stdlib",
  "wasmbind",
  "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
[build-dependencies]
rustpython-pylib = "=0.6.0"
