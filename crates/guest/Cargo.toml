[package]
name = "cirro-guest"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rquickjs = { version = "=0.14.0", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasmi = { version = "=2.0.0", default-features = false, features = [
  "stable",
  "std",
  "validate",
  "portable-dispatch",
] }
