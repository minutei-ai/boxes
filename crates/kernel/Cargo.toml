[package]
name = "cirro-kernel"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "=0.9.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_bare = "=0.5.0"
serde_json = "1"
sha2 = "=0.10.9"
wasm-bindgen = "=0.2.129"

[build-dependencies]
vbare-compiler = "=0.1.0"
