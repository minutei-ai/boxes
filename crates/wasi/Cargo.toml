[package]
name = "cirro-wasi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasmi = { version = "=2.0.0", default-features = false, features = [
  "stable",
  "std",
  "validate",
  "portable-dispatch",
] }

wasmparser = { version = "=0.245.1", default-features = false, features = ["std"] }
wasm-encoder = { version = "=0.245.1", default-features = false, features = ["std", "wasmparser"] }

[build-dependencies]
serde_json = "1"
