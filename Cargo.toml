[workspace]
members = [
  "crates/kernel",
  "crates/compiler",
  "crates/guest",
  "crates/wasi",
  "crates/python",
  "tooling/wasm-meter",
  "tooling/wasm-bench",
]
resolver = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.dependencies]
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_codegen = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_span = "=0.154.0"
oxc_transformer = "=0.154.0"
